name: Nightly desktop

on:
  schedule:
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Electron regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      E2E_HEADLESS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure Electron runtime is installed
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          fi
          test -x node_modules/electron/dist/electron
      - name: Install Linux runtime dependencies
        run: npx playwright install-deps chromium
      - name: Build and test the offline Electron game
        run: npm run test:desktop
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
